name: Keep app warm

# Vercel's free plan shuts idle servers down; the next visitor then waits for a cold start
# (1-10 s). Visiting the main pages every 5 minutes keeps an instance warm for friends.
# Public repo: GitHub Actions minutes are free. Needs the APP_URL repository variable.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Ping main pages
        run: |
          if [ -z "$APP_URL" ]; then echo "::notice::APP_URL not set — skipping."; exit 0; fi
          for path in / /matches /leaderboard /rules; do
            curl -s -o /dev/null --max-time 20 -w "$path %{http_code} %{time_total}s\n" "${APP_URL%/}$path" || true
          done
