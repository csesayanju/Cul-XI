name: Sync match data

# Calls the deployed app's protected /api/sync/* endpoints on a schedule.
# Needs (repo → Settings → Secrets and variables → Actions):
#   - variable APP_URL     e.g. https://cule-xi.vercel.app
#   - secret   CRON_SECRET same value as in Vercel
# Each job only calls Highlightly when something is due (line-ups near kickoff, stats after
# full time), so most runs make no API requests at all.

on:
  schedule:
    - cron: "5,20,35,50 * * * *" # every 15 min: line-ups + stats
    - cron: "30 5 * * *" # daily 05:30 UTC: fixtures + squads
  workflow_dispatch:
    inputs:
      job:
        description: "Which sync to run"
        type: choice
        options: [all, fixtures, squads, lineups, stats]
        default: all

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ vars.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      EVENT: ${{ github.event_name }}
      SCHEDULE: ${{ github.event.schedule }}
      INPUT_JOB: ${{ inputs.job }}
    steps:
      - name: Pick jobs
        id: pick
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_URL variable or CRON_SECRET secret not set yet — skipping."
            echo "jobs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$INPUT_JOB" = "all" ]; then jobs="fixtures squads lineups stats"; else jobs="$INPUT_JOB"; fi
          elif [ "$SCHEDULE" = "30 5 * * *" ]; then
            jobs="fixtures squads"
          else
            jobs="lineups stats"
          fi
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

      - name: Run syncs
        if: steps.pick.outputs.jobs != ''
        env:
          JOBS: ${{ steps.pick.outputs.jobs }}
        run: |
          status=0
          for job in $JOBS; do
            echo "::group::$job"
            code=$(curl -sS -o body.json -w "%{http_code}" -X POST \
              --max-time 90 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "${APP_URL%/}/api/sync/$job") || code=000
            cat body.json 2>/dev/null; echo
            echo "HTTP $code"
            echo "::endgroup::"
            if [ "$code" != "200" ]; then
              echo "::error::$job sync failed (HTTP $code)"
              status=1
            fi
          done
          exit $status
