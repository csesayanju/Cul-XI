# Supabase CLI configuration for local development (`supabase start`).
# Only settings that differ from the CLI defaults are listed here.
project_id = "cule-xi"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# Local email testing UI — magic links land here instead of a real inbox.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

# "Play as a guest" (Supabase anonymous sign-ins). Guests still need the invite code to join.
enable_anonymous_sign_ins = true

# Google sign-in for local dev: set these two env vars before `supabase start`.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true

[auth.email]
enable_signup = true
enable_confirmations = false
